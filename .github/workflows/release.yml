# Builds the app for both platforms and publishes a GitHub Release.
#
#   android  → signed release APK (arm64)            stompers-faker-vX.apk  (+ .sha256)
#   ios      → unsigned IPA for SideStore/AltStore   stompers-faker-vX.ipa  (+ .sha256)
#              (ad-hoc signed only to embed the HealthKit entitlement; SideStore re-signs
#               it with the user's own Apple ID)
#   publish  → creates the release with whatever built (APK is required, IPA optional)
#
# Trigger: push a tag like v1.2.3 whose number matches "version" in app.json
#   (bump app.json → commit → git tag v1.2.3 → git push origin v1.2.3)
# Or "Run workflow" in the Actions tab: builds both as downloadable artifacts, no release.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of the release .jks
#   ANDROID_KEYSTORE_PASSWORD store password
#   ANDROID_KEY_ALIAS         key alias
#   ANDROID_KEY_PASSWORD      key password

name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write # create releases / upload assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match app.json version $VERSION"
            exit 1
          fi

  android:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NAME: stompers-faker-v${{ needs.version.outputs.version }}.apk
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: bun install --frozen-lockfile # also applies patches/

      - name: Generate native project
        run: bunx expo prebuild --platform android --no-install

      - name: Write signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build release APK (arm64)
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Rename + checksum
        run: |
          mv android/app/build/outputs/apk/release/app-release.apk "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: |
            ${{ env.NAME }}
            ${{ env.NAME }}.sha256

      - name: Remove signing material
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"

  ios:
    needs: version
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      NAME: stompers-faker-v${{ needs.version.outputs.version }}.ipa
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate native project (runs pod install)
        run: bunx expo prebuild --platform ios

      - name: Build unsigned archive
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          xcodebuild archive \
            -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tail -n 40

      - name: Package IPA (ad-hoc signed with entitlements)
        run: |
          APP=$(ls -d "$RUNNER_TEMP"/app.xcarchive/Products/Applications/*.app | head -1)
          ENT=$(ls ios/"$SCHEME"/*.entitlements | head -1)
          # Without a signature the HealthKit entitlement isn't embedded, and SideStore
          # wouldn't request it when re-signing. "-" = ad-hoc identity.
          codesign --force --sign - --entitlements "$ENT" "$APP"
          codesign -d --entitlements - "$APP" | grep -q healthkit
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry "$NAME" Payload
          shasum -a 256 "$NAME" > "$NAME.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: |
            ${{ env.NAME }}
            ${{ env.NAME }}.sha256

  publish:
    needs: [version, android, ios]
    # Release as soon as the APK exists; the IPA is attached when its build succeeded.
    if: github.ref_type == 'tag' && always() && needs.android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Stompers Faker $GITHUB_REF_NAME" \
            --generate-notes
