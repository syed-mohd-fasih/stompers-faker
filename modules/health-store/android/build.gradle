plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.healthstore'
version = '1.0.0'

android {
  namespace = "expo.modules.healthstore"
  defaultConfig {
    versionCode = 1
    versionName = "1.0.0"
  }
  lint {
    abortOnError = false
  }
}

dependencies {
  // Health Connect client (Android). The iOS side of this module uses HealthKit.
  implementation "androidx.health.connect:connect-client:1.1.0"
}
